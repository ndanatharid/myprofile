<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NdanAthar - Logo Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark" data-theme="dark">
  
    <div id="splash-screen">
        <div class="splash-content">
            <img src="../assets/logo2.png" alt="Logo" class="splash-logo">
            <h1 class="splash-name">NdanAthar</h1>
        </div>
        <div class="splash-version">© 2026 <b>NdanAthar</b> Visual Experience</div>
    </div>

    <nav class="top-nav">
        <button class="btn-icon" id="backBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Back</span>
        </button>
        
        <button class="btn-icon" id="themeToggle">
            <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span class="mode-text">Dark Mode</span>
        </button>
    </nav>

<main class="gallery-container">
    <div class="masonry-wrapper">
        <div class="brick portrait">
            <img src="logo1.jpg" class="zoomable">
        </div>
        
        <div class="brick square">
            <img src="logo2.jpg" class="zoomable">
        </div>

        <div class="brick square">
            <img src="logo3.jpg" class="zoomable">
        </div>

        <div class="brick portrait">
            <img src="logo4.jpg" class="zoomable">
        </div>
      </div>
      <div class="masonry-wrapper">
        <div class="brick portrait">
            <img src="logo5.jpg" class="zoomable">
        </div>
        
        <div class="brick square">
            <img src="logo6.jpg" class="zoomable">
        </div>

        <div class="brick square">
            <img src="logo7.jpg" class="zoomable">
        </div>

        <div class="brick portrait">
            <img src="logo8.jpg" class="zoomable">
        </div>
      </div>
</main>


    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="imgFull">
    </div>
<footer class="footer-section">
    <div class="footer-container">
        <div class="footer-content">
            <div class="copyright-info">
                <p>&copy; 2026 <span>NdanAthar</span>. Hak Cipta Dilindungi.</p>
                <p class="footer-subtext">Didesain dengan presisi untuk pengalaman digital terbaik.</p>
            </div>
            
            <div class="footer-meta">
                <span class="version-tag">Build v2.1.0</span>
                <div class="footer-links">
                    <a href="#">Privacy</a>
                    <a href="#">Terms</a>
                    <a href="#">Cookies</a>
                </div>
            </div>
        </div>
    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
